[package]
name = "rcs-birkhoff"
version = "0.1.0"
edition = "2021"
description = "RCS (Recover, Certify, Search): exact minimum Birkhoff decompositions of doubly stochastic matrices"
authors = ["András Czégel"]
license = "MIT"
repository = "https://github.com/tg90000/rcs-birkhoff"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bin]]
name = "package"
path = "src/bin/package.rs"

[[bin]]
name = "merge"
path = "src/bin/merge.rs"

[[bin]]
name = "bound"
path = "src/bin/bound.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rand = { version = "0.8", features = ["small_rng"] }
cadical = "0.1"
mimalloc = { version = "0.1", default-features = false }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
